; =============================================================================
; Stereo INI overlay for RV1126B dual camera (2x GC2093)
;
; This file contains ONLY the stereo-specific settings that differ from
; the base rkipc-dual-800w.ini. Merge these sections into your ini file.
;
; Key changes for stereo:
;   1. isp:group_mode = 1     → synchronized AE/AWB/AF between cameras
;   2. isp:group_ldch = 1     → lens distortion correction (straight epipolar lines)
;   3. avs:sync = 1           → hardware frame sync (bSyncPipe)
;   4. avs:projection_mode = 1 → RECTILINEAR (preserves straight lines)
;   5. avs:group_iq_file      → group AWB calibration (camgroup.json)
;   6. avs:overlap_map_file   → overlap map for stitch (srcOverlapMap.bin)
;
; Files needed on device:
;   /oem/usr/share/iqfiles/gc2093_BFC105-DUAL-L_IR.xml  (from SDK)
;   /oem/usr/share/iqfiles/camgroup_gc2093_dual.json     (from stereo/)
;   /oem/usr/share/avs_calib/calib_file.xml              (your calibration)
;   /oem/usr/share/avs_calib/srcOverlapMap.bin           (from stereo/)
;   /oem/usr/share/avs_mesh/2x/multiBand_5088x1520/      (from SDK)
; =============================================================================

[isp]
scenario = normal
init_from_ini = 0
normal_scene = day
custom1_scene = night
group_mode = 1          ; ← CHANGED: 0→1 (sync AE/AWB/AF between cameras)
group_ldch = 1          ; ← CHANGED: 0→1 (lens distortion correction)

; isp.0 (camera 0 - left)
[isp.0.adjustment]
contrast    = 50
brightness  = 50
saturation  = 50

[isp.0.video_adjustment]
image_flip = close
scene_mode = indoor
power_line_frequency_mode = PAL(50HZ)

[isp.0.lens_distortion_correction]
distortion_correction = LDCH
ldch_level = 255        ; ← CHANGED: 0→255 (max correction for stereo)

; isp.1 (camera 1 - right)
[isp.1.adjustment]
contrast    = 50
brightness  = 50
saturation  = 50

[isp.1.video_adjustment]
image_flip = close
scene_mode = indoor
power_line_frequency_mode = PAL(50HZ)

[isp.1.lens_distortion_correction]
distortion_correction = LDCH
ldch_level = 255        ; ← CHANGED: 0→255 (max correction for stereo)

[avs]
sensor_num = 2
source_width = 3840
source_height = 2160
enable_avs = 1          ; ← CHANGED: 0→1 (enable AVS stitching)
avs_width = 3840
avs_height = 1080
blend_mode = 0          ; 0=cpu blend, 1=rga no blend
avs_mode = 0            ; 0=BLEND (smooth transition, good for viewing)
sync = 1                ; ← CHANGED: 0→1 (hardware frame sync)
param_source = 1        ; 1=CALIB (use calibration file)
calib_file_path = /oem/usr/share/avs_calib/calib_file.xml
middle_lut_path = /oem/usr/share/middle_lut/5m/
stitch_distance = 5
projection_mode = 1     ; ← NEW: 1=RECTILINEAR (preserves straight lines for stereo)
group_iq_file = camgroup_gc2093_dual.json       ; ← NEW: group AWB calibration
overlap_map_file = srcOverlapMap.bin             ; ← NEW: overlap map for stitch
enable_jpeg = 0
enable_venc_0 = 1
enable_venc_1 = 1
enable_ivs = 0
enable_vo = 1
vo_dev_id = 0
vo_layer_id = 1
enable_npu = 0
rotation = 0
